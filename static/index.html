<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Knowledge — RAG 知识库问答</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
  </script>
  <style>
    /* ============================
       全局重置与变量
       ============================ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-light: #eef2ff;
      --primary-bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --success-bg: #f0fdf4;
      --error: #ef4444;
      --error-bg: #fef2f2;
      --warning: #f59e0b;
      --radius: 10px;
      --radius-lg: 14px;
      --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,.08);
      --transition: .18s ease;
      --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
               'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      --mono: 'JetBrains Mono', 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
    }

    html { font-size: 15px; }
    body {
      font-family: var(--font);
      color: var(--text);
      background: var(--primary-bg);
      min-height: 100vh;
    }

    /* ============================
       布局
       ============================ */
    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ---- 侧边栏 ---- */
    .sidebar {
      width: 300px;
      min-width: 300px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .sidebar-header h1 svg { flex-shrink: 0; }
    .sidebar-header p {
      font-size: .78rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .sidebar-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
    }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      font-size: .75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
    }
    .status-dot.error { background: var(--error); }
    .status-dot.loading { background: var(--warning); animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ---- 主面板 ---- */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .main-header {
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .tabs {
      display: flex;
      gap: 4px;
    }
    .tab-btn {
      padding: 8px 18px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: .88rem;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: var(--transition);
    }
    .tab-btn:hover { color: var(--text); background: #f1f5f9; }
    .tab-btn.active {
      color: var(--primary);
      background: var(--primary-light);
    }

    .main-body {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 问答面板：全高聊天布局 */
    #panel-ask { display: none; height: 100%; }
    #panel-ask.active { display: flex; flex-direction: column; }
    /* 上传/Git 面板：自身滚动 */
    #panel-upload, #panel-git {
      height: 100%;
      overflow-y: auto;
      padding: 24px 28px;
    }
    #panel-upload { display: none; }
    #panel-upload.active { display: block; }
    #panel-git { display: none; }
    #panel-git.active { display: block; }

    .chat-layout {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .chat-history {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      min-height: 0;
    }

    .chat-empty {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }
    .chat-empty svg { opacity: .25; margin-bottom: 12px; }
    .chat-empty p { font-size: .85rem; }

    /* 底部输入区 */
    .chat-input-area {
      flex-shrink: 0;
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 10px 24px 14px;
    }
    .chat-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .chat-toolbar .mode-switch { margin-bottom: 0; }
    .mode-hint {
      font-size: .75rem;
      color: var(--text-muted);
      flex: 1;
    }
    .chat-params {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: .78rem;
      color: var(--text-secondary);
    }
    .chat-params input {
      width: 52px;
      padding: 4px 8px;
      font-size: .78rem;
    }
    .chat-form {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .chat-form textarea {
      flex: 1;
      resize: none;
      min-height: 42px;
      max-height: 130px;
      line-height: 1.5;
    }

    /* 对话消息 */
    .chat-msg { margin-bottom: 14px; }

    .chat-msg.user {
      display: flex;
      justify-content: flex-end;
    }
    .chat-msg.user .msg-bubble {
      background: var(--primary);
      color: #fff;
      border-radius: 14px 14px 4px 14px;
      padding: 10px 14px;
      max-width: 80%;
      font-size: .88rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .chat-msg.agent .msg-flow { display: flex; flex-direction: column; gap: 8px; }

    /* ============================
       组件样式
       ============================ */
    .panel { display: none; }
    .panel.active { display: block; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }
    .card:last-child { margin-bottom: 0; }
    .card-title {
      font-size: .95rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 表单 */
    .field { margin-bottom: 14px; }
    .field-label {
      display: block;
      font-size: .82rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }
    input, textarea, select {
      font: inherit;
      font-size: .88rem;
      padding: 9px 13px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      width: 100%;
      transition: var(--transition);
      outline: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79,70,229,.12);
    }
    textarea { resize: vertical; min-height: 100px; }
    select { cursor: pointer; }
    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .input-row .field { flex: 1; margin-bottom: 0; }

    /* 按钮 */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 20px;
      font-size: .85rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-primary:disabled {
      opacity: .55;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #f1f5f9;
      color: var(--text);
    }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-danger {
      background: var(--error-bg);
      color: var(--error);
    }
    .btn-danger:hover { background: #fee2e2; }
    .btn-sm { padding: 6px 13px; font-size: .8rem; }

    /* 知识库列表 */
    .kb-list { display: flex; flex-direction: column; gap: 6px; }
    .kb-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: var(--radius);
      border: 1.5px solid transparent;
      cursor: pointer;
      transition: var(--transition);
      font-size: .85rem;
    }
    .kb-item:hover { background: #f8fafc; }
    .kb-item.active {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .kb-item-name {
      font-weight: 500;
      color: var(--text);
    }
    .kb-item-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: var(--transition);
    }
    .kb-item:hover .kb-item-actions,
    .kb-item.active .kb-item-actions { opacity: 1; }
    .kb-del-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: .85rem;
      padding: 2px 5px;
      border-radius: 4px;
      transition: var(--transition);
    }
    .kb-del-btn:hover { color: var(--error); background: var(--error-bg); }

    .kb-empty {
      text-align: center;
      padding: 24px 12px;
      color: var(--text-muted);
      font-size: .82rem;
    }
    .kb-empty svg { margin-bottom: 8px; opacity: .4; }

    /* 模式切换（分段控件） */
    .mode-switch {
      display: inline-flex;
      background: #f1f5f9;
      border-radius: var(--radius);
      padding: 3px;
      gap: 2px;
      margin-bottom: 14px;
    }
    .mode-btn {
      padding: 7px 18px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: .82rem;
      font-weight: 500;
      border-radius: 7px;
      cursor: pointer;
      transition: var(--transition);
    }
    .mode-btn:hover { color: var(--text); }
    .mode-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow);
      font-weight: 600;
    }

    /* AI 回答气泡 */
    .tl-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: .9rem;
      line-height: 1.7;
    }
    /* markdown 渲染样式（回答内容） */
    .tl-bubble h1, .tl-bubble h2, .tl-bubble h3,
    .tl-bubble h4, .tl-bubble h5, .tl-bubble h6 {
      margin-top: 1em;
      margin-bottom: .4em;
      color: var(--text);
    }
    .tl-bubble p { margin: .5em 0; }
    .tl-bubble pre {
      background: #1e293b;
      color: #e2e8f0;
      padding: 14px 16px;
      border-radius: var(--radius);
      overflow-x: auto;
      font-family: var(--mono);
      font-size: .8rem;
      margin: .8em 0;
    }
    .tl-bubble code {
      font-family: var(--mono);
      font-size: .8rem;
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .tl-bubble pre code { background: transparent; padding: 0; }
    .tl-bubble ul, .tl-bubble ol { margin: .5em 0 .5em 1.5em; }
    .tl-bubble blockquote {
      border-left: 3px solid var(--primary);
      padding-left: 14px;
      color: var(--text-secondary);
      margin: .8em 0;
    }

    /* Thought 块（可展开） */
    .tl-thought {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .tl-thought-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: #fafbfc;
      cursor: pointer;
      font-size: .8rem;
      color: var(--text-secondary);
      user-select: none;
      transition: var(--transition);
    }
    .tl-thought-header:hover { background: #f1f5f9; }
    .tl-thought-arrow {
      font-size: .65rem;
      transition: transform .15s ease;
      color: var(--text-muted);
    }
    .tl-thought.open .tl-thought-arrow { transform: rotate(90deg); }
    .tl-thought-body {
      display: none;
      padding: 10px 14px;
      font-size: .8rem;
      line-height: 1.65;
      color: var(--text-secondary);
      border-top: 1px solid var(--border);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 300px;
      overflow-y: auto;
    }
    .tl-thought.open .tl-thought-body { display: block; }

    /* 工具调用行 */
    .tl-tool-call {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      background: var(--primary-light);
      border-radius: var(--radius);
      font-family: var(--mono);
      font-size: .78rem;
      color: var(--primary);
      overflow-x: auto;
      white-space: nowrap;
    }
    .tl-tool-call .tl-tool-time {
      margin-left: auto;
      color: var(--text-muted);
      font-size: .72rem;
      white-space: nowrap;
    }

    /* 工具结果（可折叠） */
    .tl-tool-result { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .tl-tool-result-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 14px;
      background: #fafbfc;
      cursor: pointer;
      font-size: .78rem;
      color: var(--text-secondary);
      user-select: none;
    }
    .tl-tool-result-header:hover { background: #f1f5f9; }
    .tl-tool-result-body {
      display: none;
      padding: 10px 14px;
      font-size: .78rem;
      line-height: 1.6;
      color: var(--text-secondary);
      border-top: 1px solid var(--border);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 200px;
      overflow-y: auto;
    }
    .tl-tool-result.open .tl-tool-result-body { display: block; }

    /* 时间线底部统计条 */
    .tl-stats {
      margin-top: 12px;
      padding: 10px 14px;
      background: #f8fafc;
      border-radius: var(--radius);
      font-size: .75rem;
      color: var(--text-muted);
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* 加载指示 */
    .spinner {
      width: 18px; height: 18px;
      border: 2.5px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg-loading {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-secondary);
      font-size: .82rem;
      padding: 6px 2px;
    }

    .sources {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .sources-label {
      font-size: .75rem;
      color: var(--text-muted);
      margin-right: 4px;
    }
    .source-chip {
      font-size: .75rem;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--primary-light);
      color: var(--primary);
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Toast 通知 */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      padding: 12px 20px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      font-size: .85rem;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: slideIn .25s ease;
      max-width: 380px;
    }
    .toast-success { border-left: 3px solid var(--success); }
    .toast-error { border-left: 3px solid var(--error); }
    .toast-info { border-left: 3px solid var(--primary); }
    @keyframes slideIn {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* ============================
       响应式
       ============================ */
    @media (max-width: 800px) {
      .sidebar { display: none; }
      .main-header { padding: 12px 16px; }
      .main-body { padding: 16px; }
      .input-row { flex-direction: column; }
      .input-row .field { width: 100%; }
    }
  </style>
</head>
<body>

<div class="app">
  <!-- ======================= 侧边栏 ======================= -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>
        </svg>
        AI Knowledge
      </h1>
      <p>RAG 知识库问答系统</p>
    </div>

    <div class="sidebar-body">
      <div class="field">
        <label class="field-label">创建知识库</label>
        <div class="input-row">
          <input id="kbName" placeholder="输入名称…" />
          <button class="btn btn-primary btn-sm" onclick="createKb()" style="flex-shrink:0;">新建</button>
        </div>
      </div>
      <div class="field" style="margin-top:16px;">
        <label class="field-label">知识库列表</label>
        <div id="kbList" class="kb-list">
          <div class="kb-empty">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>
            </svg>
            <p>暂无知识库<br/>在上方创建第一个</p>
          </div>
        </div>
      </div>
    </div>

    <div class="sidebar-footer">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">就绪</span>
    </div>
  </aside>

  <!-- ======================= 主面板 ======================= -->
  <main class="main">
    <div class="main-header">
      <div class="tabs">
        <button class="tab-btn active" data-tab="ask" onclick="switchTab('ask')">问答</button>
        <button class="tab-btn" data-tab="upload" onclick="switchTab('upload')">上传</button>
        <button class="tab-btn" data-tab="git" onclick="switchTab('git')">Git</button>
      </div>
      <div class="input-row" style="gap:8px;">
        <select id="kbSelect" style="width:auto;min-width:140px;font-size:.82rem;padding:7px 12px;">
          <option value="">— 选择知识库 —</option>
        </select>
        <span style="font-size:.78rem;color:var(--text-muted);" id="kbInfo"></span>
      </div>
    </div>

    <div class="main-body">

      <!-- ========== 问答面板（聊天布局） ========== -->
      <div class="panel active" id="panel-ask">
        <div class="chat-layout">
          <!-- 对话流（可滚动） -->
          <div class="chat-history" id="chatHistory">
            <div class="chat-empty" id="chatEmpty">
              <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                <line x1="12" y1="8" x2="12" y2="14"/><line x1="9" y1="11" x2="15" y2="11"/>
              </svg>
              <p>选择一个知识库，在下方输入问题开始对话</p>
            </div>
          </div>

          <!-- 底部固定输入区 -->
          <div class="chat-input-area">
            <div class="chat-toolbar">
              <div class="mode-switch">
                <button class="mode-btn active" data-mode="rag" onclick="switchMode('rag')">普通问答</button>
                <button class="mode-btn" data-mode="agent" onclick="switchMode('agent')">Agent 模式</button>
              </div>
              <span id="modeHint" class="mode-hint">单轮检索 + 生成，适合快速直接的问题。</span>
              <div class="chat-params">
                <span>top</span>
                <input id="topk" type="number" value="4" min="1" max="15" style="width:52px;" />
                <span id="maxStepsGroup" style="display:none;">· 步数</span>
                <input id="maxSteps" type="number" value="5" min="1" max="10" style="width:52px;display:none;" />
              </div>
            </div>
            <form class="chat-form" onsubmit="ask();return false">
              <textarea id="question" rows="1" placeholder="输入问题，Enter 发送（Shift+Enter 换行）"></textarea>
              <button class="btn btn-primary" id="askBtn" type="submit">发送</button>
            </form>
          </div>
        </div>
      </div>

      <!-- ========== 上传面板 ========== -->
      <div class="panel" id="panel-upload">
        <div class="card">
          <div class="card-title">上传文件到知识库</div>
          <div class="field">
            <label class="field-label">选择文件</label>
            <input id="files" type="file" multiple />
            <span style="font-size:.78rem;color:var(--text-muted);margin-top:5px;display:block;">
              支持格式：.txt · .md · .py · .java · .sql · .csv · .json
            </span>
          </div>
          <button class="btn btn-primary" onclick="uploadFiles()">上传并处理</button>
          <div id="uploadResult" style="margin-top:14px;display:none;">
            <pre style="background:#f8fafc;padding:12px;border-radius:var(--radius);font-size:.8rem;overflow-x:auto;"></pre>
          </div>
        </div>
      </div>

      <!-- ========== Git 面板 ========== -->
      <div class="panel" id="panel-git">
        <div class="card">
          <div class="card-title">从 Git 仓库导入</div>
          <div class="field">
            <label class="field-label">仓库地址</label>
            <input id="gitUrl" placeholder="https://github.com/用户名/仓库名.git" />
          </div>
          <div class="input-row">
            <div class="field">
              <label class="field-label">分支（可选）</label>
              <input id="gitBranch" placeholder="main" />
            </div>
            <div class="field">
              <label class="field-label">用户名（可选）</label>
              <input id="gitUser" placeholder="用于私有仓库认证" />
            </div>
            <div class="field">
              <label class="field-label">Token（可选）</label>
              <input id="gitToken" type="password" placeholder="访问令牌" />
            </div>
          </div>
          <button class="btn btn-primary" onclick="ingestGit()">导入仓库</button>
          <div id="gitResult" style="margin-top:14px;display:none;">
            <pre style="background:#f8fafc;padding:12px;border-radius:var(--radius);font-size:.8rem;overflow-x:auto;"></pre>
          </div>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- Toast 容器 -->
<div class="toast-container" id="toastContainer"></div>

<script>
  // ====================================
  // 状态
  // ====================================
  let currentKb = '';

  // ====================================
  // Toast 通知（替代 alert）
  // ====================================
  function toast(message, type = 'info') {
    const container = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.textContent = message;
    container.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, 2800);
    setTimeout(() => el.remove(), 3200);
  }

  // ====================================
  // Tab 切换
  // ====================================
  function switchTab(name) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
    document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === `panel-${name}`));
  }

  // ====================================
  // 更新状态指示器
  // ====================================
  function setStatus(text, state = 'ok') {
    document.getElementById('statusText').textContent = text;
    const dot = document.getElementById('statusDot');
    dot.className = 'status-dot';
    if (state === 'error') dot.classList.add('error');
    else if (state === 'loading') dot.classList.add('loading');
  }

  // ====================================
  // 知识库管理
  // ====================================
  async function loadKbs() {
    try {
      setStatus('加载中…', 'loading');
      const res = await fetch('/kb');
      const j = await res.json();
      const items = j.items || [];

      // 更新侧边栏列表
      const list = document.getElementById('kbList');
      if (items.length === 0) {
        list.innerHTML = `<div class="kb-empty">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          <p>暂无知识库<br/>在上方创建第一个</p>
        </div>`;
      } else {
        list.innerHTML = items.map(n => `
          <div class="kb-item${n === currentKb ? ' active' : ''}" onclick="selectKb('${n}')">
            <span class="kb-item-name">${n}</span>
            <div class="kb-item-actions">
              <button class="kb-del-btn" onclick="event.stopPropagation();delKb('${n}')" title="删除">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              </button>
            </div>
          </div>
        `).join('');
      }

      // 更新下拉
      const sel = document.getElementById('kbSelect');
      sel.innerHTML = '<option value="">— 选择知识库 —</option>';
      items.forEach(n => {
        const o = document.createElement('option');
        o.value = n; o.textContent = n;
        if (n === currentKb) o.selected = true;
        sel.appendChild(o);
      });

      // 更新信息
      updateKbInfo();
      setStatus(items.length ? `${items.length} 个知识库` : '就绪');
    } catch (e) {
      setStatus('连接失败', 'error');
    }
  }

  function selectKb(name) {
    currentKb = name;
    document.getElementById('kbSelect').value = name;
    // 更新侧边栏高亮
    document.querySelectorAll('.kb-item').forEach(el => {
      el.classList.toggle('active', el.querySelector('.kb-item-name')?.textContent === name);
    });
    updateKbInfo();
  }

  function updateKbInfo() {
    const el = document.getElementById('kbInfo');
    const val = document.getElementById('kbSelect').value;
    el.textContent = val ? `当前：${val}` : '';
  }

  async function createKb() {
    const name = document.getElementById('kbName').value.trim();
    if (!name) { toast('请输入知识库名称', 'error'); return; }
    try {
      const res = await fetch('/kb', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      if (res.ok) {
        toast(`知识库「${name}」创建成功`, 'success');
        document.getElementById('kbName').value = '';
        await loadKbs();
        selectKb(name);
      } else {
        const j = await res.json();
        toast(j.detail || '创建失败', 'error');
      }
    } catch (e) {
      toast('网络错误，请检查连接', 'error');
    }
  }

  async function delKb(name) {
    if (!confirm(`确定要删除知识库「${name}」吗？\n此操作不可恢复。`)) return;
    try {
      const res = await fetch(`/kb/${name}`, { method: 'DELETE' });
      if (res.ok) {
        toast(`知识库「${name}」已删除`, 'success');
        if (currentKb === name) currentKb = '';
        await loadKbs();
      } else {
        toast('删除失败', 'error');
      }
    } catch (e) {
      toast('网络错误', 'error');
    }
  }

  // ====================================
  // 文件上传
  // ====================================
  async function uploadFiles() {
    const kb = document.getElementById('kbSelect').value;
    if (!kb) { toast('请先选择一个知识库', 'error'); return; }
    const files = document.getElementById('files').files;
    if (!files.length) { toast('请选择要上传的文件', 'error'); return; }

    const fd = new FormData();
    for (const f of files) fd.append('files', f);

    const resultDiv = document.getElementById('uploadResult');
    resultDiv.style.display = 'block';
    resultDiv.querySelector('pre').textContent = '正在上传并处理…';
    setStatus('上传中…', 'loading');

    try {
      const res = await fetch(`/kb/${kb}/upload`, { method: 'POST', body: fd });
      const j = await res.json();
      if (res.ok) {
        const count = j.ingested || 0;
        resultDiv.querySelector('pre').textContent =
          `已成功处理 ${files.length} 个文件，共生成 ${count} 个文档片段，已加入知识库「${kb}」。`;
        toast(`导入成功：${count} 个文档片段`, 'success');
        document.getElementById('files').value = '';
      } else {
        resultDiv.querySelector('pre').textContent = j.detail || '上传失败';
        toast('上传失败', 'error');
      }
    } catch (e) {
      resultDiv.querySelector('pre').textContent = `错误: ${e.message}`;
      toast('网络错误', 'error');
    }
    setStatus('就绪');
  }

  // ====================================
  // Git 导入
  // ====================================
  async function ingestGit() {
    const kb = document.getElementById('kbSelect').value;
    if (!kb) { toast('请先选择一个知识库', 'error'); return; }
    const url = document.getElementById('gitUrl').value.trim();
    if (!url) { toast('请输入 Git 仓库地址', 'error'); return; }

    const body = {
      repo_url: url,
      branch: document.getElementById('gitBranch').value.trim() || null,
      username: document.getElementById('gitUser').value.trim() || null,
      token: document.getElementById('gitToken').value.trim() || null,
    };

    const resultDiv = document.getElementById('gitResult');
    resultDiv.style.display = 'block';
    resultDiv.querySelector('pre').textContent = '正在导入仓库…';
    setStatus('克隆中…', 'loading');

    try {
      const res = await fetch(`/kb/${kb}/git`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const j = await res.json();
      if (res.ok) {
        const count = j.ingested_docs || 0;
        resultDiv.querySelector('pre').textContent =
          `仓库已导入，共生成 ${count} 个文档片段，已加入知识库「${kb}」。`;
        toast(`导入成功：${count} 个文档片段`, 'success');
        document.getElementById('gitUrl').value = '';
        document.getElementById('gitBranch').value = '';
        document.getElementById('gitUser').value = '';
        document.getElementById('gitToken').value = '';
      } else {
        resultDiv.querySelector('pre').textContent = j.detail || '导入失败';
        toast('导入失败', 'error');
      }
    } catch (e) {
      resultDiv.querySelector('pre').textContent = `错误: ${e.message}`;
      toast('网络错误', 'error');
    }
    setStatus('就绪');
  }

  // ====================================
  // 模式切换（普通问答 / Agent）
  // ====================================
  let currentMode = 'rag';

  function switchMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));

    const hint = document.getElementById('modeHint');
    const maxSteps = document.getElementById('maxSteps');
    const maxStepsLabel = document.getElementById('maxStepsGroup');

    if (mode === 'rag') {
      hint.textContent = '单轮检索 + 生成，适合快速直接的问题。';
      maxSteps.style.display = 'none';
      maxStepsLabel.style.display = 'none';
    } else {
      hint.textContent = 'Agent 自主多步检索，适合需要对比、综合多份文档的问题。';
      maxSteps.style.display = 'inline-block';
      maxStepsLabel.style.display = 'inline';
    }
  }

  // ====================================
  // 对话流消息管理
  // ====================================
  function scrollToBottom() {
    const h = document.getElementById('chatHistory');
    h.scrollTop = h.scrollHeight;
  }

  function hideEmpty() {
    const empty = document.getElementById('chatEmpty');
    if (empty) empty.style.display = 'none';
  }

  function addUserMessage(text) {
    hideEmpty();
    const history = document.getElementById('chatHistory');
    const div = document.createElement('div');
    div.className = 'chat-msg user';
    div.innerHTML = `<div class="msg-bubble">${esc(text)}</div>`;
    history.appendChild(div);
    scrollToBottom();
    return div;
  }

  function addAgentMessage(html) {
    hideEmpty();
    const history = document.getElementById('chatHistory');
    const div = document.createElement('div');
    div.className = 'chat-msg agent';
    div.innerHTML = `<div class="msg-flow">${html}</div>`;
    history.appendChild(div);
    scrollToBottom();
    return div;
  }

  function addLoadingMessage() {
    hideEmpty();
    const history = document.getElementById('chatHistory');
    const div = document.createElement('div');
    div.className = 'chat-msg agent';
    div.innerHTML = `<div class="msg-loading"><div class="spinner"></div><span id="loadingText">AI 正在思考…</span></div>`;
    history.appendChild(div);
    scrollToBottom();
    return div;
  }

  // ====================================
  // 问答（双模式，消息进入对话流）
  // ====================================
  async function ask() {
    const kb = document.getElementById('kbSelect').value;
    if (!kb) { toast('请先选择一个知识库', 'error'); return; }
    const q = document.getElementById('question').value.trim();
    if (!q) { toast('请输入问题', 'error'); return; }

    const btn = document.getElementById('askBtn');

    // 用户消息进入对话流，清空输入框
    addUserMessage(q);
    document.getElementById('question').value = '';
    btn.disabled = true;
    btn.textContent = '思考中…';
    setStatus('生成回答中…', 'loading');

    // Agent 模式显示多步提示
    const loadingEl = addLoadingMessage();
    const loadingText = document.getElementById('loadingText');
    loadingText.textContent = currentMode === 'agent'
      ? 'Agent 正在思考：解析任务、检索知识库、综合回答…'
      : 'AI 正在检索知识库并生成回答…';

    try {
      // Agent 模式调 /agent/run，普通模式调 /chat
      const url = currentMode === 'agent' ? '/agent/run' : '/chat';
      const payload = currentMode === 'agent'
        ? { kb, task: q, max_steps: parseInt(document.getElementById('maxSteps').value) || 5 }
        : { kb, question: q, top_k: parseInt(document.getElementById('topk').value) || 4 };

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const j = await res.json();

      loadingEl.remove();

      if (res.ok && j.answer) {
        let html;
        if (currentMode === 'agent') {
          const srcs = extractSourcesFromTrace(j.trace?.events || []);
          html = renderAgentFlow(j.trace?.events || [], j.answer, srcs,
            j.trace?.total_duration_ms || null, j.completed);
          if (!j.completed) {
            toast('任务未完全完成（步数限制）', 'info');
          }
        } else {
          const srcs = (j.sources || []).map(s => s.source).filter(Boolean);
          html = renderAgentFlow([], j.answer, srcs, null, true);
        }
        addAgentMessage(html);
        toast('回答完成', 'success');
      } else {
        addAgentMessage(`<div style="color:var(--error);padding:12px;background:var(--error-bg);border-radius:var(--radius);font-size:.85rem;">${esc(j.error || '获取答案失败')}</div>`);
      }
    } catch (e) {
      loadingEl.remove();
      addAgentMessage(`<div style="color:var(--error);padding:12px;background:var(--error-bg);border-radius:var(--radius);font-size:.85rem;">网络错误，请检查连接</div>`);
      toast('网络错误', 'error');
    }

    btn.disabled = false;
    btn.textContent = '发送';
    setStatus('就绪');
  }

  // ====================================
  // AI 侧流程渲染（Thought → 工具 → 回答）
  // 返回 HTML 字符串，由 addAgentMessage 追加到对话流
  // ====================================
  function renderAgentFlow(events, answer, sources, totalMs, completed) {
    let html = '';

    // 事件流：Thought → 工具调用 → 工具结果
    let toolCount = 0;
    let pendingTool = null; // 等下一个 tool_result 一起渲染（用它的耗时）

    for (const e of events || []) {
      if (e.event === 'think') {
        // 模型推理过程（来自 Ollama message.thinking 或 <think> 标签）
        // 渲染为可展开的 Thought 块，展示完整思考内容
        if (e.detail) {
          html += `<div class="tl-thought" onclick="this.classList.toggle('open')">
            <div class="tl-thought-header">
              <span class="tl-thought-arrow">▶</span>
              <span>Thought for ${formatDuration(e.duration_ms)}</span>
            </div>
            <div class="tl-thought-body">${esc(e.detail)}</div>
          </div>`;
        }
      } else if (e.event === 'llm') {
        // llm 事件如果是工具调用 JSON → 提取 thought
        // JSON 里的 thought 是模型调用工具前的简短说明，
        // 以普通文本气泡展示在流程中间（与最终回答同格式），
        const parsed = extractToolCallJson(e.detail);
        if (parsed && parsed.thought) {
          html += `<div class="tl-bubble">${marked.parse(parsed.thought)}</div>`;
        }
      } else if (e.event === 'tool_call') {
        toolCount++;
        const [name, argsStr] = splitToolDetail(e.detail || '');
        pendingTool = { name, args: argsStr };
      } else if (e.event === 'tool_result') {
        // 工具调用行（耗时用 tool_result 的 duration_ms）
        if (pendingTool) {
          html += `<div class="tl-tool-call">
            <span>${esc(pendingTool.name)}</span>
            <span style="color:var(--text-secondary);">${esc(pendingTool.args || '')}</span>
            <span class="tl-tool-time">${formatDuration(e.duration_ms)}</span>
          </div>`;
          pendingTool = null;
        }
        // 工具结果（可折叠，默认收起）
        const snippet = (e.detail || '').slice(0, 400);
        html += `<div class="tl-tool-result" onclick="this.classList.toggle('open')">
          <div class="tl-tool-result-header">
            <span class="tl-thought-arrow">▶</span>
            <span>工具结果 · ${formatDuration(e.duration_ms)}</span>
          </div>
          <div class="tl-tool-result-body">${esc(snippet)}${e.detail && e.detail.length > 400 ? '…' : ''}</div>
        </div>`;
      } else if (e.event === 'max_steps' || e.event === 'give_up') {
        html += `<div style="color:var(--error);font-size:.8rem;padding:8px 14px;background:var(--error-bg);border-radius:var(--radius);">${esc(e.detail)}</div>`;
      }
      // start / final_answer 跳过（final_answer 用 answer 参数渲染）
    }

    // 最终回答
    if (answer) {
      html += `<div class="tl-bubble">${marked.parse(answer)}</div>
        ${sources.length ? `<div class="sources">
          <span class="sources-label">来源</span>
          ${sources.slice(0, 8).map(s => `<span class="source-chip" title="${s}">${s}</span>`).join('')}
        </div>` : ''}`;
    }

    // 统计条
    const maxStep = (events || []).reduce((m, e) => Math.max(m, e.step || 0), 0);
    html += `<div class="tl-stats">
      ${totalMs ? `<span>总耗时 ${formatDuration(totalMs)}</span>` : ''}
      ${events.length ? `<span>步骤 ${maxStep}</span>
      <span>工具调用 ${toolCount} 次</span>` : ''}
      ${completed === false ? '<span style="color:var(--warning);">未完成（步数限制）</span>' : ''}
    </div>`;

    return html;
  }

  function formatDuration(ms) {
    if (ms == null || isNaN(ms)) return '';
    if (ms < 1000) return `${Math.round(ms)}ms`;
    const s = ms / 1000;
    if (s < 60) return `${s.toFixed(1)}s`;
    const m = Math.floor(s / 60);
    const sec = Math.round(s % 60);
    return `${m}m ${sec}s`;
  }

  function splitToolDetail(detail) {
    const idx = detail.indexOf(' ');
    if (idx === -1) return [detail, ''];
    return [detail.slice(0, idx), detail.slice(idx + 1)];
  }

  function extractSourcesFromTrace(events) {
    const sources = [];
    for (const e of events) {
      if (e.event === 'tool_result') {
        // 从工具结果中提取 (xxx) 形式的来源路径
        const matches = (e.detail || '').match(/\(([^)]+\.\w+)\)/g) || [];
        for (const m of matches) {
          const src = m.slice(1, -1);
          if (src && !sources.includes(src)) sources.push(src);
        }
      }
    }
    return sources;
  }

  function esc(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function extractToolCallJson(text) {
    // 容错提取工具调用 JSON：先整体解析，失败则提取 {..} 子串
    if (!text) return null;
    try {
      const d = JSON.parse(text);
      if (d && d.tool) return d;
    } catch { /* 继续尝试子串提取 */ }
    const start = text.indexOf('{');
    const end = text.lastIndexOf('}');
    if (start !== -1 && end > start) {
      try {
        const d = JSON.parse(text.slice(start, end + 1));
        if (d && d.tool) return d;
      } catch { /* 提取失败 */ }
    }
    return null;
  }

  // ====================================
  // 输入框交互：Enter 发送、Shift+Enter 换行、自动增高
  // ====================================
  const qInput = document.getElementById('question');
  qInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();  // 阻止默认换行
      if (!document.getElementById('askBtn').disabled) {
        ask();
      }
    }
  });
  qInput.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 130) + 'px';
  });

  // ====================================
  // 事件绑定 & 初始化
  // ====================================
  document.getElementById('kbSelect').addEventListener('change', function() {
    currentKb = this.value;
    updateKbInfo();
    // 同步侧边栏高亮
    document.querySelectorAll('.kb-item').forEach(el => {
      el.classList.toggle('active', el.querySelector('.kb-item-name')?.textContent === currentKb);
    });
  });

  loadKbs();
</script>
</body>
</html>
